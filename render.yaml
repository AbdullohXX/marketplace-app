# Render Blueprint for the course demo. Supply dedicated cloud database URLs in Render.
services:
  - type: web
    name: savdo-marketplace
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: marketplace
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
